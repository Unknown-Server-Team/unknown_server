paths:
  /api/v1/health:
    get:
      tags:
        - System
      summary: Get API health status
      description: Returns the current health status and performance metrics of the API
      responses:
        200:
          description: Health check information
  /api/v1/metrics:
    get:
      tags:
        - System
      summary: Get API performance metrics
      description: Returns detailed performance metrics of the API
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [hour, day, week]
          description: Time period for metrics data
      responses:
        200:
          description: Performance metrics
  /api/v1/routes:
    get:
      tags:
        - System
      summary: Get all API routes
      description: Returns information about all available API routes
      responses:
        200:
          description: List of API routes
  /api/v1/users:
    get:
      summary: Get list of users
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        200:
          description: List of users
  /api/v1/users/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: User details
        403:
          description: Insufficient permissions
        404:
          description: User not found
    put:
      summary: Update user profile
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Profile updated successfully
        403:
          description: Insufficient permissions
    delete:
      summary: Delete user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: User deleted successfully
        403:
          description: Insufficient permissions
  /api/v1/auth/roles:
    get:
      summary: List all roles
      tags: [Authorization]
      security:
        - bearerAuth: []
      responses:
        200:
          description: All roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/user/{id}/roles:
    get:
      summary: Get the roles assigned to a user
      tags: [Authorization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        200:
          description: Roles assigned to the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/user/{id}/roles/{role}:
    post:
      summary: Assign a role to a user
      tags: [Authorization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RoleName'
      responses:
        201:
          description: Role assigned; returns the user's updated roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleChangeResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: The user already has the role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleError'
    delete:
      summary: Remove a role from a user
      tags: [Authorization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RoleName'
      responses:
        200:
          description: Role removed; returns the user's updated roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleChangeResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: Removing the role would leave the server without an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleError'
components:
  parameters:
    UserId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    RoleName:
      in: path
      name: role
      required: true
      description: Role name
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,50}$'
  schemas:
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
    RoleListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    RoleChangeResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    RoleError:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid user ID or role name
    Unauthorized:
      description: Missing, invalid or expired token
    Forbidden:
      description: Caller is not a verified admin
    NotFound:
      description: User, role or role assignment not found
